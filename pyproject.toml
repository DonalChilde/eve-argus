[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[project]
keywords = ['python']
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

    "License :: OSI Approved :: MIT License",

]
authors = [{ name = "Chad Lowe", email = "pfmsoft.dev@gmail.com" }]
name = "eve-argus"
version = "0.1.0"
description = "A terminal interface for Eve Online information gathering and management."

readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

# https://chrisholdgraf.com/blog/2022/install-github-from-pyproject/
# https://peps.python.org/pep-0508/#examples
# "pfmsoft-snippets@git+https://github.com/donalchilde/pfmsoft-snippets@0.0.1"
dependencies = [
    "aiohttp>=3.12.15",
    "esi-link",
    "eve-static-data>=0.1.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[tool.uv.sources]
esi-link = { git = "https://github.com/DonalChilde/esi-link", branch = "main" }
eve-static-data = { git = "https://github.com/DonalChilde/eve-static-data", branch = "main" }

[dependency-groups]
# Dev dependencies
# https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies
# https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
    "scriv>=1.7.0",
]
lint = ["ruff>=0.13.1"]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "rich>=13.0.0",
]
# Documentation building dependencies like Sphinx
doc = []

[project.scripts]
eve-argus = "eve_argus.cli.main_typer:app"

[project.urls]
Documentation = "https://github.com/DonalChilde/eve-argus#readme"
# Documentation_rtd = "https://eve-argus.readthedocs.io"
Issues = "https://github.com/DonalChilde/eve-argus/issues"
Source = "https://github.com/DonalChilde/eve-argus"


[tool.pytest.ini_options]
pythonpath = "src"
log_file = "logs/tests.log"
log_file_date_format = "%Y-%m-%dT%H:%M:%S.%f%z"
log_file_format = "%(asctime)s %(levelname)s:%(funcName)s: %(message)s [in %(pathname)s:%(lineno)d]"
log_file_level = "INFO"
norecursedirs = "tests/old"

[tool.coverage.run]
branch = true
parallel = true
# omit = [""]

[tool.ruff.lint]
select = ["B", "UP", "D", "DOC", "FIX", "I", "F401"]
# non-imperative-mood (D401)
ignore = ["D401", "D101"]
# extend-select = ["I"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.scriv]
#version = "literal: pyproject.toml: project.version"
version = "literal: src/eve_argus/__init__.py: __version__"
format = "md"
md_header_level = "2"
entry_title_template = "file: changelog.d/templates/entry_title_template.md.j2"
new_fragment_template = "file: changelog.d/templates/new_fragment.${config:format}.j2"
