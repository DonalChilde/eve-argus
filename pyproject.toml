[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
keywords = ['python']
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

    "License :: OSI Approved :: MIT License",

]
authors = [{ name = "Chad Lowe", email = "pfmsoft.dev@gmail.com" }]
name = "eve-argus"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dynamic = ["version", "description"]
# https://chrisholdgraf.com/blog/2022/install-github-from-pyproject/
# https://peps.python.org/pep-0508/#examples
# "pfmsoft-snippets@git+https://github.com/donalchilde/pfmsoft-snippets@0.0.1"
dependencies = [
    "preston>=4.12.1",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
]

[project.scripts]
eve-argus = "eve_argus.cli.main_typer:app"

[project.urls]
Documentation = "https://github.com/DonalChilde/eve-argus#readme"
# Documentation_rtd = "https://eve-argus.readthedocs.io"
Issues = "https://github.com/DonalChilde/eve-argus/issues"
Source = "https://github.com/DonalChilde/eve-argus"


[tool.ruff.lint]
select = ["B", "UP", "D", "DOC"]
# non-imperative-mood (D401)
exclude = ["D401", "D101"]
extend-select = ["I"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = "src"
log_file = "logs/tests.log"
log_file_date_format = "%Y-%m-%dT%H:%M:%S.%f%z"
log_file_format = "%(asctime)s %(levelname)s:%(funcName)s: %(message)s [in %(pathname)s:%(lineno)d]"
log_file_level = "INFO"

[tool.coverage.run]
branch = true
parallel = true
# omit = [""]

[tool.scriv]
#version = "literal: pyproject.toml: project.version"
version = "literal: src/eve_argus/__init__.py: __version__"
format = "md"
md_header_level = "2"
entry_title_template = "file: changelog.d/templates/entry_title_template.md.j2"
new_fragment_template = "file: changelog.d/templates/new_fragment.${config:format}.j2"

[dependency-groups]
dev = [
    "coverage[toml]>=7.9.1",
    "mypy>=1.16.1",
    "nox>=2025.5.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.1",
    "scriv>=1.7.0",
]
doc = [
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.2.0",
    "sphinx-rtd-theme>=3.0.2",
    "sphinxcontrib-typer>=0.5.1",
]
